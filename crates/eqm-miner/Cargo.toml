[package]
name = "eqm-miner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Optimized multi-threaded EQM miner with multi-RPC broadcast"

[[bin]]
name = "eqm-miner"
path = "src/main.rs"

[dependencies]
equihash-core = { path = "../equihash-core", features = ["solver"] }
